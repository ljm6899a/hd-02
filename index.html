<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Stock Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Zoom Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        akira: '#DA291C', // 아키라 테마 레드
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #1F2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .white-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black tracking-tighter text-gray-900">STOCK<span class="text-akira">BOARD</span></span>
            <span class="text-xs text-gray-500 bg-gray-100 px-2.5 py-1 font-semibold">v1.3 True Candlestick</span>
        </div>
        <!-- Settings Gear Button -->
        <button class="w-9 h-9 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-600 hover:text-akira hover:border-akira transition-colors">
            ⚙️
        </button>
    </header>

    <!-- Main Content: Split Screen (Left / Right) -->
    <main class="flex-1 flex overflow-hidden p-6 gap-6">
        
        <!-- LEFT HALF: Charts -->
        <section class="w-1/2 flex flex-col space-y-4 overflow-y-auto pr-2">
            <!-- Ticker Input & Period Selectors -->
            <div class="white-card p-4 flex items-center space-x-3 shadow-sm rounded-xl shrink-0">
                <input type="text" id="tickerInput" placeholder="종목명 또는 티커 입력 (예: AAPL, 삼성전자)" 
                       class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-akira text-gray-900 placeholder-gray-400">
                
                <!-- Period Buttons (일/주/월/년) -->
                <div class="flex bg-gray-50 p-1 rounded-lg border border-gray-200">
                    <button class="px-3 py-1 text-xs font-bold text-gray-700 hover:text-akira rounded bg-white shadow-sm">일</button>
                    <button class="px-3 py-1 text-xs font-bold text-gray-500 hover:text-akira rounded">주</button>
                    <button class="px-3 py-1 text-xs font-bold text-gray-500 hover:text-akira rounded">월</button>
                    <button class="px-3 py-1 text-xs font-bold text-gray-500 hover:text-akira rounded">년</button>
                </div>

                <button onclick="loadStockData()" class="bg-gray-900 hover:bg-akira text-white font-bold px-5 py-2 rounded-lg text-sm transition-colors">
                    LOAD
                </button>
            </div>

            <!-- Chart Container Area -->
            <div class="flex-1 flex flex-col space-y-4">
                <!-- Main Candlestick Custom Chart -->
                <div class="white-card rounded-xl p-4 flex flex-col h-1/2 shadow-sm relative">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-sm font-bold text-gray-800" id="chartTitle">Apple Inc. (AAPL) - 캔들스틱 일봉 차트</h3>
                        <span class="text-xs text-akira bg-red-50 px-2 py-0.5 rounded font-bold">드래그: 줌 / 더블클릭: 초기화</span>
                    </div>
                    <div class="relative flex-1 w-full" style="min-height: 150px;">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>

                <!-- Sub Chart: RSI (Top) & Volume (Bottom) Dual Axis -->
                <div class="white-card rounded-xl p-4 flex flex-col h-1/2 shadow-sm relative">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-sm font-bold text-gray-800">RSI & 거래량</h3>
                        <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded font-bold">MTS 복합 뷰</span>
                    </div>
                    <div class="relative flex-1 w-full" style="min-height: 150px;">
                        <canvas id="subChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT HALF: 2x2 Grid Navigation Buttons -->
        <section class="w-1/2 flex flex-col justify-center items-center p-8 white-card rounded-2xl shadow-sm">
            <div class="w-full max-w-lg mb-8">
                <h2 class="text-xl font-black tracking-tight text-gray-900 mb-1">DASHBOARD NAVIGATION</h2>
                <p class="text-xs text-gray-500 font-medium">원하시는 분석 탭을 선택하여 심층 인사이트를 확인하세요.</p>
            </div>

            <!-- Grid Menu (2x2) -->
            <div class="grid grid-cols-2 gap-6 w-full max-w-lg">
                <!-- News Button -->
                <button onclick="navigateTo('news')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">01</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">뉴스</h3>
                        <p class="text-xs text-gray-400 mt-1">실시간 금융 뉴스 분석</p>
                    </div>
                </button>

                <!-- Indicator Judgment Button -->
                <button onclick="navigateTo('judgment')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">02</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">지표 판단</h3>
                        <p class="text-xs text-gray-400 mt-1">퀀트 매수·매도 진단</p>
                    </div>
                </button>

                <!-- Portfolio Button -->
                <button onclick="navigateTo('portfolio')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">03</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">포트폴리오</h3>
                        <p class="text-xs text-gray-400 mt-1">자산 관리 및 포트폴리오</p>
                    </div>
                </button>

                <!-- Placeholder Slot -->
                <div class="relative white-card p-6 rounded-2xl text-left flex flex-col justify-between h-40 bg-gray-50/50 border-dashed border-gray-200">
                    <span class="text-gray-300 text-xs font-black">04</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-300">추가 예정</h3>
                        <p class="text-xs text-gray-300 mt-1">확장 기능 슬롯</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript for Custom Candlestick Chart Engine -->
    <script>
        let priceChart, subChart;

        // 진짜 봉(캔들스틱)을 직접 그리기 위한 커스텀 Chart.js 플러그인
        const candlestickPlugin = {
            id: 'candlestickCustom',
            afterDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                const dataset = chart.data.datasets[0];
                if (!dataset || !dataset.candles) return;

                ctx.save();
                dataset.candles.forEach((candle, index) => {
                    const xCoord = x.getPixelForValue(index);
                    const openCoord = y.getPixelForValue(candle.o);
                    const closeCoord = y.getPixelForValue(candle.c);
                    const highCoord = y.getPixelForValue(candle.h);
                    const lowCoord = y.getPixelForValue(candle.l);

                    const isUp = candle.c >= candle.o;
                    const color = isUp ? '#EF4444' : '#3B82F6'; // 양봉: 빨강, 음봉: 파랑

                    // 1. 고가-저가 심지(Wick) 그리기
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(xCoord, highCoord);
                    ctx.lineTo(xCoord, lowCoord);
                    ctx.stroke();

                    // 2. 시가-종가 몸통(Body) 그리기
                    const topY = Math.min(openCoord, closeCoord);
                    const bottomY = Math.max(openCoord, closeCoord);
                    const height = Math.max(bottomY - topY, 2); // 최소 두께 보장
                    const width = 10; // 봉 너비

                    ctx.fillStyle = color;
                    ctx.fillRect(xCoord - width / 2, topY, width, height);
                });
                ctx.restore();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const dates = [
                '2026.08.01', '2026.08.02', '2026.08.03', '2026.08.04', '2026.08.05', 
                '2026.08.06', '2026.08.07', '2026.08.08', '2026.08.09', '2026.08.10'
            ];

            // 캔들 데이터 구조 (o: 시가, h: 고가, l: 저가, c: 종가)
            const rawCandles = [
                { o: 168, h: 173, l: 167, c: 170 }, // 양봉
                { o: 170, h: 175, l: 169, c: 172 }, // 양봉
                { o: 172, h: 174, l: 168, c: 169 }, // 음봉
                { o: 169, h: 177, l: 169, c: 175 }, // 양봉
                { o: 175, h: 180, l: 174, c: 178 }, // 양봉
                { o: 178, h: 179, l: 172, c: 176 }, // 음봉
                { o: 176, h: 182, l: 175, c: 180 }, // 양봉
                { o: 180, h: 184, l: 179, c: 182 }, // 양봉
                { o: 182, h: 183, l: 178, c: 181 }, // 음봉
                { o: 181, h: 186, l: 180, c: 185 }  // 양봉
            ];

            const zoomOptions = {
                zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
                pan: { enabled: true, mode: 'x' }
            };

            // 1. Price Chart (캔들스틱 + 이동평균선)
            const ctxPrice = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctxPrice, {
                type: 'line', // 캔들 아래 레이어 백업용 (빈 데이터셋)
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: '이동평균선 (5일)',
                            data: [168, 170, 171, 172, 174, 175, 177, 179, 180, 182],
                            borderColor: '#F59E0B',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.2
                        },
                        {
                            label: '이동평균선 (20일)',
                            data: [165, 166, 167, 168, 169, 170, 172, 173, 174, 175],
                            borderColor: '#10B981',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.2
                        }
                    ],
                    candles: rawCandles // 커스텀 캔들 데이터 주입
                },
                plugins: [candlestickPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } },
                        zoom: zoomOptions
                    },
                    scales: {
                        x: { 
                            grid: { color: '#F3F4F6' }, 
                            ticks: { color: '#6B7280', font: { size: 10 } } 
                        },
                        y: { 
                            min: 160,
                            max: 190,
                            grid: { color: '#F3F4F6' }, 
                            ticks: { color: '#6B7280', font: { size: 10 } } 
                        }
                    }
                }
            });

            // 2. Sub Chart: RSI & Volume Dual Axis
            const ctxSub = document.getElementById('subChart').getContext('2d');
            subChart = new Chart(ctxSub, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'RSI',
                            data: [48, 52, 50, 58, 62, 55, 63, 61, 65, 68],
                            borderColor: '#8B5CF6',
                            backgroundColor: '#8B5CF6',
                            type: 'line',
                            borderWidth: 2,
                            tension: 0.2,
                            pointRadius: 2,
                            yAxisID: 'yRsi'
                        },
                        {
                            label: '거래량',
                            data: [40, 35, 45, 50, 55, 38, 60, 48, 52, 72],
                            backgroundColor: 'rgba(156, 163, 175, 0.5)',
                            borderRadius: 3,
                            yAxisID: 'yVolume'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } },
                        zoom: zoomOptions
                    },
                    scales: {
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#6B7280', font: { size: 10 } } 
                        },
                        yVolume: {
                            type: 'linear',
                            position: 'left',
                            grid: { color: '#F3F4F6' },
                            ticks: { color: '#6B7280', font: { size: 9 } },
                            title: { display: true, text: '거래량', font: { size: 9, weight: 'bold' } }
                        },
                        yRsi: {
                            type: 'linear',
                            position: 'right',
                            min: 0,
                            max: 100,
                            grid: { display: false },
                            ticks: { color: '#8B5CF6', font: { size: 9 } },
                            title: { display: true, text: 'RSI', font: { size: 9, weight: 'bold' } }
                        }
                    }
                }
            });
        });

        function loadStockData() {
            const ticker = document.getElementById('tickerInput').value.toUpperCase() || 'AAPL';
            document.getElementById('chartTitle').innerText = `${ticker} - 캔들스틱 일봉 차트`;
            
            // 새로운 무작위 캔들 데이터 생성
            let base = 150;
            const newCandles = Array.from({length: 10}, () => {
                let o = base + Math.floor(Math.random() * 10 - 5);
                let c = o + Math.floor(Math.random() * 14 - 7);
                let h = Math.max(o, c) + Math.floor(Math.random() * 5);
                let l = Math.min(o, c) - Math.floor(Math.random() * 5);
                base = c;
                return { o, h, l, c };
            });

            priceChart.data.candles = newCandles;
            priceChart.update();
            subChart.update();
        }

        function navigateTo(tabName) {
            alert(`${tabName.toUpperCase()} 페이지로 이동합니다!`);
        }
    </script>
</body>
</html>
