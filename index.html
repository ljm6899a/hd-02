<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Stock Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        akira: '#DA291C', // 아키라 테마 레드
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #1F2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .white-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Bar: Macro Indices Ticker -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black tracking-tighter text-gray-900">STOCK<span class="text-akira">BOARD</span></span>
            <span class="text-xs text-gray-500 bg-gray-100 px-2.5 py-1 font-semibold">v1.0 Landing</span>
        </div>
        <!-- Macro Indices Crawler Bar -->
        <div class="flex space-x-6 text-sm overflow-x-auto font-medium">
            <div class="flex items-center space-x-2 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
                <span class="text-gray-500">USDKRW</span>
                <span class="font-bold text-akira">1,485.00</span>
                <span class="text-xs text-akira">+0.2%</span>
            </div>
            <div class="flex items-center space-x-2 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
                <span class="text-gray-500">KOSPI</span>
                <span class="font-bold text-gray-900">2,680.15</span>
                <span class="text-xs text-gray-500">-0.4%</span>
            </div>
            <div class="flex items-center space-x-2 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
                <span class="text-gray-500">S&P 500</span>
                <span class="font-bold text-gray-900">5,230.40</span>
                <span class="text-xs text-gray-500">+0.8%</span>
            </div>
        </div>
    </header>

    <!-- Main Content: Split Screen (Left / Right) -->
    <main class="flex-1 flex overflow-hidden p-6 gap-6">
        
        <!-- LEFT HALF: Macro & Stock Charts -->
        <section class="w-1/2 flex flex-col space-y-4 overflow-y-auto pr-2">
            <!-- Stock Ticker Selector -->
            <div class="white-card p-4 flex items-center space-x-3 shadow-sm rounded-xl">
                <input type="text" id="tickerInput" placeholder="종목명 또는 티커 입력 (예: AAPL, 삼성전자)" 
                       class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-akira text-gray-900 placeholder-gray-400">
                <button onclick="loadStockData()" class="bg-gray-900 hover:bg-akira text-white font-bold px-5 py-2 rounded-lg text-sm transition-colors">
                    차트 로드
                </button>
            </div>

            <!-- Chart Container Area -->
            <div class="flex-1 flex flex-col space-y-4">
                <!-- Main Price & Bollinger Band Chart -->
                <div class="white-card rounded-xl p-4 flex flex-col h-1/2 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-gray-800" id="chartTitle">Apple Inc. (AAPL) - 가격 & 볼린저밴드</h3>
                        <span class="text-xs text-akira bg-red-50 px-2 py-0.5 rounded font-bold">일평균 / 볼린저</span>
                    </div>
                    <div class="relative flex-1 w-full" style="min-height: 150px;">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <!-- Sub Charts (Volume & RSI) -->
                <div class="grid grid-cols-2 gap-4 h-1/3">
                    <!-- Volume Chart -->
                    <div class="white-card rounded-xl p-3 flex flex-col shadow-sm">
                        <span class="text-xs font-bold text-gray-500 mb-1">거래량 (Volume)</span>
                        <div class="relative flex-1 w-full" style="min-height: 100px;">
                            <canvas id="volumeChart"></canvas>
                        </div>
                    </div>
                    <!-- RSI Chart -->
                    <div class="white-card rounded-xl p-3 flex flex-col shadow-sm">
                        <span class="text-xs font-bold text-gray-500 mb-1">RSI 지표</span>
                        <div class="relative flex-1 w-full" style="min-height: 100px;">
                            <canvas id="rsiChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT HALF: Grid Navigation Buttons -->
        <section class="w-1/2 flex flex-col justify-center items-center p-8 white-card rounded-2xl shadow-sm">
            <div class="w-full max-w-lg mb-8">
                <h2 class="text-xl font-black tracking-tight text-gray-900 mb-1">DASHBOARD NAVIGATION</h2>
                <p class="text-xs text-gray-500 font-medium">원하시는 분석 탭을 선택하여 심층 인사이트를 확인하세요.</p>
            </div>

            <!-- Grid Menu (2x2) -->
            <div class="grid grid-cols-2 gap-6 w-full max-w-lg">
                <!-- News Button -->
                <button onclick="navigateTo('news')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">01</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">뉴스</h3>
                        <p class="text-xs text-gray-400 mt-1">실시간 금융 뉴스 분석</p>
                    </div>
                </button>

                <!-- Indicator Judgment Button -->
                <button onclick="navigateTo('judgment')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">02</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">지표 판단</h3>
                        <p class="text-xs text-gray-400 mt-1">퀀트 매수·매도 진단</p>
                    </div>
                </button>

                <!-- Ontology Button -->
                <button onclick="navigateTo('ontology')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">03</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">온톨로지</h3>
                        <p class="text-xs text-gray-400 mt-1">산업 공급망 연관 관계</p>
                    </div>
                </button>

                <!-- Personal Settings Button -->
                <button onclick="navigateTo('settings')" class="group relative white-card hover:border-akira p-6 rounded-2xl transition-all duration-300 text-left flex flex-col justify-between h-40 shadow-sm hover:shadow-md">
                    <span class="text-akira text-xs font-black">04</span>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 group-hover:text-akira transition-colors">개인설정</h3>
                        <p class="text-xs text-gray-400 mt-1">포트폴리오 환경 설정</p>
                    </div>
                </button>
            </div>
        </section>

    </main>

    <!-- JavaScript for Charts & Interactivity -->
    <script>
        let mainChart, volumeChart, rsiChart;

        window.addEventListener('DOMContentLoaded', () => {
            const labels = ['5일전', '4일전', '3일전', '2일전', '어제', '오늘'];
            
            // Main Price & Bollinger Bands Chart
            const ctxMain = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctxMain, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '상단 밴드',
                            data: [180, 182, 181, 185, 187, 190],
                            borderColor: '#9CA3AF',
                            borderWidth: 1,
                            borderDash: [4, 4],
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: '하단 밴드',
                            data: [170, 174, 171, 175, 177, 180],
                            borderColor: '#9CA3AF',
                            borderWidth: 1,
                            borderDash: [4, 4],
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: '일평균 주가',
                            data: [175, 178, 176, 180, 182, 185],
                            borderColor: '#DA291C',
                            backgroundColor: 'rgba(218, 41, 28, 0.05)',
                            borderWidth: 2.5,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#6B7280', font: { size: 10 } } },
                        y: { grid: { color: '#F3F4F6' }, ticks: { color: '#6B7280', font: { size: 10 } } }
                    }
                }
            });

            // Volume Chart
            const ctxVolume = document.getElementById('volumeChart').getContext('2d');
            volumeChart = new Chart(ctxVolume, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: [42, 38, 55, 60, 48, 72],
                        backgroundColor: '#1F2937',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                }
            });

            // RSI Chart
            const ctxRsi = document.getElementById('rsiChart').getContext('2d');
            rsiChart = new Chart(ctxRsi, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: [52, 58, 55, 63, 61, 68],
                        borderColor: '#DA291C',
                        borderWidth: 2,
                        tension: 0.2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { min: 20, max: 80, grid: { color: '#F3F4F6' }, ticks: { color: '#6B7280', font: { size: 9 } } }
                    }
                }
            });
        });

        function loadStockData() {
            const ticker = document.getElementById('tickerInput').value.toUpperCase() || 'AAPL';
            document.getElementById('chartTitle').innerText = `${ticker} - 가격 & 볼린저밴드`;
            
            const randomFactor = () => (Math.random() * 20 - 10);
            const newData = [150+randomFactor(), 155+randomFactor(), 153+randomFactor(), 160+randomFactor(), 158+randomFactor(), 165+randomFactor()];
            
            mainChart.data.datasets[2].data = newData;
            mainChart.update();
            volumeChart.update();
            rsiChart.update();
        }

        function navigateTo(tabName) {
            alert(`${tabName.toUpperCase()} 페이지로 이동합니다!`);
        }
    </script>
</body>
</html>
