<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Stock Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { akira: '#DA291C' } } } }
    </script>
    <style>
        body { background-color: #FAFAFA; color: #1F2937; font-family: sans-serif; }
        .white-card { background: #FFFFFF; border: 1px solid #E5E7EB; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-black tracking-tighter">STOCK<span class="text-akira">BOARD</span></h1>
        <button class="text-gray-500 hover:text-akira transition-colors text-2xl">⚙️</button>
    </header>

    <main class="flex-1 flex p-6 gap-6 overflow-hidden">
        
        <!-- LEFT: Charts -->
        <section class="w-1/2 flex flex-col gap-4 overflow-y-auto pr-2">
            <!-- Ticker & Period Buttons -->
            <div class="white-card p-4 shadow-sm rounded-xl flex items-center gap-4">
                <input type="text" id="tickerInput" placeholder="티커 입력..." class="flex-1 bg-gray-50 border border-gray-200 rounded px-4 py-2 text-sm focus:outline-none focus:border-akira">
                <div class="flex gap-1">
                    <button class="text-xs px-2 py-1 font-bold hover:text-akira">일</button>
                    <button class="text-xs px-2 py-1 font-bold hover:text-akira">주</button>
                    <button class="text-xs px-2 py-1 font-bold hover:text-akira">월</button>
                    <button class="text-xs px-2 py-1 font-bold hover:text-akira">년</button>
                </div>
                <button onclick="loadCharts()" class="bg-gray-900 hover:bg-akira text-white font-bold px-4 py-2 rounded text-xs transition-colors">LOAD</button>
            </div>

            <!-- Main Chart: Price + Moving Averages -->
            <div class="white-card p-4 shadow-sm rounded-xl h-64">
                <canvas id="priceChart"></canvas>
            </div>

            <!-- Sub Chart: Volume + RSI (Dual Axis) -->
            <div class="white-card p-4 shadow-sm rounded-xl h-48">
                <canvas id="subChart"></canvas>
            </div>
        </section>

        <!-- RIGHT: Navigation -->
        <section class="w-1/2 grid grid-cols-2 gap-4 h-full">
            <button onclick="navigateTo('뉴스')" class="white-card p-8 flex flex-col justify-between hover:border-akira transition-all rounded-2xl">
                <span class="text-akira font-black">01</span><span class="text-2xl font-black">NEWS</span>
            </button>
            <button onclick="navigateTo('지표 판단')" class="white-card p-8 flex flex-col justify-between hover:border-akira transition-all rounded-2xl">
                <span class="text-akira font-black">02</span><span class="text-2xl font-black">JUDGEMENT</span>
            </button>
            <button onclick="navigateTo('포트폴리오')" class="white-card p-8 flex flex-col justify-between hover:border-akira transition-all rounded-2xl col-span-2">
                <span class="text-akira font-black">03</span><span class="text-2xl font-black">PORTFOLIO</span>
            </button>
        </section>
    </main>

    <script>
        let priceChart, subChart;
        const labels = ['1일', '2일', '3일', '4일', '5일', '6일', '7일'];

        function initCharts() {
            // Price Chart (일목균형 및 이평선 반영 구조)
            priceChart = new Chart(document.getElementById('priceChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '주가', data: [150, 155, 153, 160, 158, 165, 170], borderColor: '#DA291C', tension: 0.1 },
                        { label: '5일', data: [148, 150, 152, 155, 157, 160, 162], borderColor: '#9CA3AF', borderDash: [5, 5], borderWidth: 1 },
                        { label: '20일', data: [140, 142, 145, 147, 150, 152, 155], borderColor: '#6B7280', borderWidth: 1 },
                        { label: '60일', data: [130, 132, 135, 137, 140, 142, 145], borderColor: '#374151', borderWidth: 1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Sub Chart (Volume Bar + RSI Line Dual Axis)
            subChart = new Chart(document.getElementById('subChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '거래량', data: [500, 700, 400, 800, 600, 900, 750], backgroundColor: '#E5E7EB', yAxisID: 'y' },
                        { label: 'RSI', data: [45, 55, 50, 65, 60, 70, 68], borderColor: '#DA291C', type: 'line', yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false } } }
                }
            });
        }

        function loadCharts() { alert("데이터 로딩 로직 연동 구간"); }
        function navigateTo(t) { alert(t + " 페이지로 이동"); }
        window.onload = initCharts;
    </script>
</body>
</html>
